[package]
name = "merisedot"
description = "SQL design tool, inspired by Cambalache and Gaphor"
authors = ["kheldae <taho.gougeon@gmail.com>"]
version = "0.1.0"
edition = "2024"

[lib]
name = "stag"
path = "lib/lib.rs"

[[test]]
name = "mdottest"
harness = false

[dependencies]
adw = { version = "0.8.1", package = "libadwaita", features = ["v1_8"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_20"] }
indexmap = { version = "2.13.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
cucumber = { version = "0.22.1", features = ["tracing"] }
rand = "0.10.0"
tokio = { version = "1.50.0", features = ["full"] }
